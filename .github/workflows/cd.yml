name: CD

# TRIGGERS
# - push to "main"       -> build and publish a Docker image after code is merged
# - workflow_dispatch    -> can also be started manually from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

# Give the built-in GITHUB_TOKEN permission to push packages to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository code into the runner
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (build tool)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to the GitHub Container Registry (ghcr.io)
      #    Uses the temporary GITHUB_TOKEN provided by Actions - no secrets needed
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build the Docker image and push it to GHCR
      #    Tags: "latest" plus the commit SHA so every build is traceable
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
